name: CI

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build-and-push:
    needs: test
    # Only publish images from main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Image names on GHCR must be lowercase (owner "Wafa358" -> "wafa358")
      - name: Image name and short commit SHA
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/task-api" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      sha: ${{ steps.vars.outputs.sha }}

  # GitOps: write the new image tag into the Helm values in Git.
  # ArgoCD watches the repo and deploys the change - CI never touches the cluster.
  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set new image tag in values.yaml
        run: |
          SHA="${{ needs.build-and-push.outputs.sha }}"
          sed -i -E "s/^(\s*tag:\s*).*/\1\"${SHA}\"/" k8s/task-api/values.yaml
          grep "tag:" k8s/task-api/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/task-api/values.yaml
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Deploy task-api ${{ needs.build-and-push.outputs.sha }}"
          git push
