# ArgoCD Application: tells ArgoCD to keep the cluster in sync with the
# Helm chart in this Git repository (the "source of truth").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Wafa358/gitops-platform.git
    targetRevision: main
    path: k8s/task-api
    helm:
      releaseName: task-api
  destination:
    server: https://kubernetes.default.svc
    namespace: task-api
  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
    # On a fresh cluster the ServiceMonitor/PrometheusRule CRDs arrive with the
    # monitoring app a few minutes later: keep retrying instead of giving up.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
