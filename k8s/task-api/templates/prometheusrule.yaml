{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: task-api
      rules:
        - alert: TaskApiDown
          expr: sum(up{namespace="{{ .Release.Namespace }}", service="{{ .Release.Name }}"}) == 0 or absent(up{namespace="{{ .Release.Namespace }}", service="{{ .Release.Name }}"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Task API is down
            description: No Task API pod has been reachable by Prometheus for 1 minute.
        - alert: TaskApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Task API error rate above 5%
            description: More than 5% of requests returned a 5xx status over the last 5 minutes.
        - alert: TaskApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Task API p95 latency above 500 ms
            description: 95% of requests should complete in under 500 ms.
{{- end }}
