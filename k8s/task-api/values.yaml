replicaCount: 2

image:
  repository: ghcr.io/wafa358/task-api
  # Updated automatically by the CI pipeline (update-manifest job) - GitOps:
  # CI writes the new tag to Git, ArgoCD sees the commit and deploys it.
  tag: "0abe44e"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8000

# Prometheus scraping, alert rules and Grafana dashboard
# (requires the monitoring stack - see k8s/argocd/monitoring-app.yaml)
monitoring:
  enabled: true
  scrapeInterval: 15s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
